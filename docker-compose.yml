services:
  db:
    image: postgis/postgis:15-3.4
    container_name: terralux-db
    restart: always
    environment:
      POSTGRES_USER: terralux
      POSTGRES_PASSWORD: terralux_secret
      POSTGRES_DB: terralux_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U terralux -d terralux_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: terralux-api
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://terralux:terralux_secret@db:5432/terralux_db
      - JWT_SECRET=terralux_super_secret_jwt_key_hackathon_2026
      - JWT_ALGORITHM=HS256
      - ENVIRONMENT=production
    ports:
      - "8000:8000"
    volumes:
      - ./uploads:/app/uploads
      - ./data:/app/data

volumes:
  pgdata:
