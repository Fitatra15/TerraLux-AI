services:
  db:
    image: postgis/postgis:15-3.4
    container_name: terralux-db
    restart: always
    environment:
      POSTGRES_USER: terralux
      POSTGRES_PASSWORD: terralux_secret
      POSTGRES_DB: terralux_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U terralux -d terralux_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2024-01-31T20-20-33Z
    container_name: terralux-minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: terralux_minio_admin
      MINIO_ROOT_PASSWORD: terralux_minio_secret_2026
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  ollama:
    image: ollama/ollama:latest
    container_name: terralux-ollama
    restart: always
    ports:
      - "11434:11434"
    volumes:
      - ollamadata:/root/.ollama

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: terralux-api
    restart: always
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_started
      ollama:
        condition: service_started
    environment:
      - DATABASE_URL=postgresql://terralux:terralux_secret@db:5432/terralux_db
      - JWT_SECRET=terralux_super_secret_jwt_key_hackathon_2026
      - JWT_ALGORITHM=HS256
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=terralux_minio_admin
      - MINIO_SECRET_KEY=terralux_minio_secret_2026
      - MINIO_BUCKET=terralux-data
      - OLLAMA_URL=http://ollama:11434
      - LLM_MODEL=qwen2.5:7b
      - ENVIRONMENT=production
    ports:
      - "8000:8000"
    volumes:
      - ./uploads:/app/uploads
      - ./data:/app/data

volumes:
  pgdata:
  miniodata:
  ollamadata:
